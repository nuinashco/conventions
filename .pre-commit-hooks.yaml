# Hooks this repo provides to repos that use pre-commit without uv; uv projects run the same
# commands as local `uv run` hooks, pinned by their uv.lock (GUIDE TOOL-2, TOOL-4).
- id: check-comments
  name: comments are sentences, no banners, class docstrings are noun phrases (GUIDE DOC)
  entry: check-comments
  language: python
  types: [python]
- id: check-conventions
  name: code rules an AST can decide (GUIDE)
  entry: check-conventions
  language: python
  types: [python]
- id: check-commit-msg
  name: commit message is one short conventional line (GUIDE GIT-1, GIT-2)
  entry: check-commit-msg
  language: python
  stages: [commit-msg]
- id: review-comments
  name: comments and descriptions say only what the code cannot (GUIDE DOC-2 to DOC-7, asks claude -p)
  entry: review-comments
  language: python
  pass_filenames: false
  always_run: true
  stages: [manual]
